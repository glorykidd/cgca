# Workflow for deploying CGCA Blazor Web App (ASP.NET Core SSR + WASM interactive)
name: Deploy CGCA Web
permissions:
  contents: read

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths: [ cgca.new/** ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      deploy_chatbot:
        description: "Deploy chatbot worker to Cloudflare"
        type: boolean
        default: true

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-website:
    name: Deploy CGCA Website
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout new code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate build number
        id: buildid
        run: |
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy.MM.dd-HH.mm")
          echo "formattedTime=$buildTime" >> $env:GITHUB_OUTPUT
      - name: Run tests for solution
        run: |
          dotnet test cgca.new/cgca.sln --configuration Release --logger "console;verbosity=minimal" > C:/deployment-stage/cgca-tests-${{ steps.buildid.outputs.formattedTime }}.md
      - name: List all changed files
        run: |
          Set-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value ""
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value "Publish Results for CGCA"
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value ""
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value "Build Number - ${{ steps.buildid.outputs.formattedTime }}"
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value "---------------------------------"
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value ""
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value "Commit Item Messages:"
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value "---------------------------------"
          $mergeCommit = git log --format=%B -n 1 HEAD
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value $mergeCommit
          $parentCount = (git cat-file -p HEAD | Select-String "^parent").Count
          if ($parentCount -gt 1) {
            Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value ""
            Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value "Included Commits:"
            $prCommits = git log --format="- %s" HEAD^1..HEAD^2
            Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value ($prCommits -join "`n")
          }
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value ""
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value "Changed Files"
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value "---------------------------------"
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value $(git diff --name-status HEAD~1..HEAD)
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value ""
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value "Test Results:"
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value "---------------------------------"
          Add-Content -Path C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt -Value (Get-Content -Path C:/deployment-stage/cgca-tests-${{ steps.buildid.outputs.formattedTime }}.md)
      - name: Verify production config exists
        run: |
          if (-not (Test-Path "C:/www-root/cedargrovechristianacademy.org/appsettings.Production.json")) {
            Write-Error "appsettings.Production.json is missing from the server. Deploy aborted."
            exit 1
          }
      - name: Create backup of current website
        run: |
          New-Item -ItemType "directory" -Path "C:/deployment-stage/cgca/${{ steps.buildid.outputs.formattedTime }}/" -Force
          Copy-Item C:/www-root/cedargrovechristianacademy.org/* -Destination C:/deployment-stage/cgca/${{ steps.buildid.outputs.formattedTime }}/ -Recurse
          Compress-Archive -Path "C:/deployment-stage/cgca/${{ steps.buildid.outputs.formattedTime }}/*" -Update -DestinationPath C:/backups/cgca-${{ steps.buildid.outputs.formattedTime }}.zip -CompressionLevel "Fastest"
          Remove-Item -Path C:/deployment-stage/cgca/${{ steps.buildid.outputs.formattedTime }} -Recurse
      - name: Stop IIS app pool before deploy
        run: |
          Import-Module WebAdministration
          if ((Get-WebAppPoolState -Name "CedarGroveChristianAcademy" -ErrorAction SilentlyContinue).Value -eq "Started") {
            Stop-WebAppPool -Name "CedarGroveChristianAcademy"
            Start-Sleep -Seconds 3
          }
      - name: Deploy new code
        run: |
          cd cgca.new/cgca.web
          dotnet publish -c Release -o C:/www-root/cedargrovechristianacademy.org/
      - name: Start IIS app pool after deploy
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "CedarGroveChristianAcademy"
      - name: Email Notification
        run: |
          cd  D:/it-tools/mailer
          ./SesMailer.exe --to  "David Nuckolls <david.nuckolls@glorykidd.com>" --subject "CGCA Release ${{ steps.buildid.outputs.formattedTime }}" --body C:/deployment-stage/cgca-${{ steps.buildid.outputs.formattedTime }}.txt --format text  --from-display-name "CGCA Website"

  deploy-chatbot:
    name: Deploy Chatbot Worker
    needs: deploy-website
    if: ${{ inputs.deploy_chatbot != false }}
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout new code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Deploy chatbot worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd cgca.new/cgca-chatbot-worker
          npm ci
          npx wrangler deploy
